{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HAL9MIL{% endblock %}</title>
  <link rel="icon" href="{% static 'img/Isotipo.svg' %}" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .sidebar-link {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 1rem; border-radius: 0.5rem;
      color: #94a3b8; font-size: 0.875rem; font-weight: 500;
      transition: all 0.15s; text-decoration: none;
    }
    .sidebar-link:hover { color: #ffffff; background-color: #334155; }
    .sidebar-link.active { color: #ffffff; background-color: #0284c7; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-60 min-h-screen bg-slate-900 flex flex-col fixed top-0 left-0 z-30">
    <!-- Logo -->
    <div class="px-4 py-4 border-b border-slate-700">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center overflow-hidden flex-shrink-0 p-0.5">
          <img src="{% static 'img/Isotipo.svg' %}" alt="Loginco" class="w-full h-full object-contain">
        </div>
        <div class="min-w-0">
          <p class="text-white font-bold text-sm leading-tight">HAL9MIL</p>
          <p class="text-slate-500 text-xs truncate">Loginco · CASA.GDB</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="{% url 'dashboard' %}"
         class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a href="{% url 'lista' %}"
         class="sidebar-link {% if request.resolver_match.url_name == 'lista' or request.resolver_match.url_name == 'detalle' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Referencias
      </a>
    </nav>

    <!-- Patentes legend -->
    <div class="px-4 py-3 border-t border-slate-700">
      <p class="text-slate-600 text-xs uppercase tracking-wider mb-2">Patentes</p>
      <div class="space-y-1">
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-sky-500"></span>1627 · LCLF
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>1656 · LCRR
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-violet-500"></span>1927 · LCMJ
        </div>
      </div>
    </div>

    <!-- User -->
    <div class="px-4 py-4 border-t border-slate-700">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 rounded-full bg-slate-600 flex items-center justify-center flex-shrink-0">
            <span class="text-white text-xs font-bold">
              {{ request.user.username|slice:":1"|upper }}
            </span>
          </div>
          <span class="text-slate-300 text-xs truncate">{{ request.user.username }}</span>
        </div>
        <a href="{% url 'logout' %}" title="Cerrar sesión"
           class="text-slate-500 hover:text-red-400 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-60 flex-1 min-h-screen">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
