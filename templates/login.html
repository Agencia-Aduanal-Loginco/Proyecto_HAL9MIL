{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAL9MIL · Acceso</title>
  <link rel="icon" href="{% static 'img/Isotipo.svg' %}" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white mb-4 p-2">
        <img src="{% static 'img/Isotipo.svg' %}" alt="Loginco" class="w-full h-full object-contain">
      </div>
      <img src="{% static 'img/Logotipo-Horizontal-Comercial.png' %}" alt="Loginco"
           class="h-8 object-contain mx-auto mb-3 opacity-90"
           style="filter: brightness(0) invert(1);">
      <p class="text-slate-400 text-sm">Sistema de Seguimiento Aduanal</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800 rounded-2xl p-8 shadow-xl border border-slate-700">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        {% if form.errors %}
          <div class="bg-red-900/40 border border-red-700 text-red-300 text-sm rounded-lg px-4 py-3">
            Usuario o contraseña incorrectos.
          </div>
        {% endif %}

        <div>
          <label class="block text-slate-300 text-sm font-medium mb-1.5">Usuario</label>
          <input type="text" name="username" autofocus autocomplete="username"
            class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-4 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent
                   placeholder-slate-500 text-sm"
            placeholder="Tu usuario">
        </div>

        <div>
          <label class="block text-slate-300 text-sm font-medium mb-1.5">Contraseña</label>
          <input type="password" name="password" autocomplete="current-password"
            class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-4 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent
                   placeholder-slate-500 text-sm"
            placeholder="••••••••">
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit"
          class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2.5 rounded-lg
                 transition-colors text-sm">
          Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">
      Loginco · Datos CASA.GDB · Patentes 1627 · 1656 · 1927
    </p>
  </div>
</body>
</html>
