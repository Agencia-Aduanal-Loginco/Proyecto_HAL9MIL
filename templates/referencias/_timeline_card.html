{% comment %}Recibe: e (evento dict con color, titulo, fecha, actor, datos){% endcomment %}
<div class="bg-white rounded-xl border shadow-sm px-4 py-3.5 transition-shadow hover:shadow-md
  {% if e.color == 'violet'  %}border-violet-100
  {% elif e.color == 'slate' %}border-slate-100
  {% elif e.color == 'amber' %}border-amber-100
  {% elif e.color == 'green' %}border-green-100
  {% elif e.color == 'sky'   %}border-sky-100
  {% elif e.color == 'emerald'%}border-emerald-100
  {% elif e.color == 'indigo'%}border-indigo-100
  {% else %}border-slate-100{% endif %}">

  <!-- Título + fecha (fecha visible solo en mobile, en desktop va al lado) -->
  <div class="flex items-start justify-between gap-2">
    <p class="font-semibold text-sm leading-tight
      {% if e.color == 'violet'  %}text-violet-700
      {% elif e.color == 'slate' %}text-slate-700
      {% elif e.color == 'amber' %}text-amber-700
      {% elif e.color == 'green' %}text-green-700
      {% elif e.color == 'sky'   %}text-sky-700
      {% elif e.color == 'emerald'%}text-emerald-700
      {% elif e.color == 'indigo'%}text-indigo-700
      {% else %}text-slate-700{% endif %}">
      {{ e.titulo }}
    </p>
    <!-- Fecha solo en mobile -->
    <span class="md:hidden text-xs text-slate-400 font-mono whitespace-nowrap shrink-0 mt-0.5">{{ e.fecha }}</span>
  </div>

  <!-- Actor -->
  {% if e.actor %}
  <p class="mt-1 text-xs text-slate-500">
    <span class="text-slate-400">por</span>
    <span class="font-medium text-slate-600 ml-0.5">{{ e.actor }}</span>
  </p>
  {% endif %}

  <!-- Datos clave -->
  {% if e.datos %}
  <dl class="mt-2 space-y-0.5 border-t border-slate-50 pt-2">
    {% for label, valor in e.datos %}
    <div class="flex items-baseline gap-2 text-xs">
      <dt class="text-slate-400 shrink-0 w-28 truncate">{{ label }}</dt>
      <dd class="text-slate-600 font-mono text-xs truncate">{{ valor }}</dd>
    </div>
    {% endfor %}
  </dl>
  {% endif %}

</div>
